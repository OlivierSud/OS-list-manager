<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1d1d1d">
  <link rel="manifest" href="manifest.json">
  <title>OS List Manager</title>

  <!-- PWA Settings -->
  <meta name="description"
    content="Une application simple et puissante pour gérer vos listes de tâches et courses. Synchronisation Supabase." />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons (Small, Modern) -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css?v=9">
</head>

<body>

  <div id="login-container" class="login-screen">
    <h1>OS List Manager</h1>
    <p>Connectez-vous pour gérer vos listes.</p>
    <button id="login-button" class="btn-send login-btn">
      <i data-lucide="log-in"></i> Se connecter avec Google
    </button>
    <button id="install-button-login" class="btn-send login-btn secondary hidden">
      <i data-lucide="download"></i> Installer l'application
    </button>
  </div>

  <div id="app" class="hidden">

    <!-- PWA Install Banner (Mobile Only) -->
    <div id="pwa-install-banner" class="hidden glass-panel pwa-banner">
      <div class="pwa-banner-content">
        <i data-lucide="download" style="color: var(--accent-color);"></i>
        <div>
          <div class="pwa-banner-title">Installer l'application</div>
          <div class="pwa-banner-desc">Accès rapide depuis l'écran d'accueil</div>
        </div>
      </div>
      <button onclick="installPWAFromBanner()" class="btn-send pwa-install-btn">Installer</button>
    </div>

    <!-- Header -->
    <header class="glass-panel">
      <!-- Row 1: Back + Title + Avatar + Refresh -->
      <div id="header-title-row" class="header-row title-row">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <button id="back-button" class="btn-icon hidden" onclick="goHome()">
            <i data-lucide="arrow-left"></i>
          </button>

          <h1 id="header-title">Mes Listes</h1>

          <div id="user-profile-container" class="hidden profile-container">
            <img id="user-avatar" src="" alt="Profil" class="hidden avatar-img">
            <div id="user-avatar-fallback" class="hidden avatar-fallback">
              <i data-lucide="user"></i>
            </div>

            <!-- Logout Menu -->
            <div id="user-menu" class="hidden glass-panel user-dropdown">
              <button id="btn-logout-header" class="btn-icon logout-menu-btn">
                <i data-lucide="log-out"></i> Déconnexion
              </button>
            </div>
          </div>

          <div class="theme-switch-container" style="margin-left: 0.5rem; display: flex; align-items: center;">
            <label class="theme-switch" for="theme-checkbox">
              <input type="checkbox" id="theme-checkbox">
              <span class="slider">
                <i data-lucide="sun" class="icon-sun"></i>
                <i data-lucide="moon" class="icon-moon"></i>
              </span>
            </label>
          </div>

          <button id="sound-toggle" class="btn-icon" title="Activer/Désactiver les sons" style="margin-left: 0.25rem;">
            <i data-lucide="volume-2" id="sound-icon" style="width: 18px; height: 18px;"></i>
          </button>

          <button id="refresh-button" class="btn-icon hidden" title="Rafraîchir l'application" onclick="refreshApp()"
            style="margin-left: 0.5rem;">
            <i data-lucide="refresh-cw"></i>
          </button>
        </div>
      </div>

      <!-- Row 2: Search + Filter + Settings -->
      <div id="header-controls-row" class="header-row controls-row">
        <div id="search-container" class="hidden">
          <i data-lucide="search"></i>
          <input type="text" id="search-input" placeholder="Rechercher...">
        </div>
        <div style="display: flex; gap: 0.25rem;">
          <button id="filter-button" class="btn-icon hidden">
            <i data-lucide="filter"></i>
          </button>
          <button id="settings-button" class="btn-icon">
            <i data-lucide="settings"></i>
          </button>
        </div>
      </div>

      <!-- Row 3: Progress bar: shown when a list is open -->
      <div id="header-progress" class="header-row progress-row hidden">
        <div class="progress-info">
          <span id="header-progress-label"></span>
          <span id="header-progress-pct"></span>
        </div>
        <div class="progress-track">
          <div id="header-progress-fill">
            <div id="header-progress-fill-wave"></div>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main>
      <!-- Lists View (Default) -->
      <div id="lists-container" class="fade-in">
        <!-- Lists will be rendered here by JS -->
      </div>

      <!-- Tasks View (Initially Hidden) -->
      <div id="tasks-container" class="hidden">
        <!-- Tasks will be rendered here by JS -->
      </div>
    </main>

    <!-- Floating Action Button (New List) -->
    <button id="fab" class="fab">
      <i data-lucide="plus" style="width: 32px; height: 32px;"></i>
    </button>



    <!-- Action Sheet / Modal -->
    <div id="action-modal" class="hidden modal-overlay">
      <div class="glass-panel modal-content">
        <h3 id="modal-title">Options</h3>
        <p id="modal-desc"></p>

        <div class="modal-actions">
          <button id="btn-rename" class="btn-icon modal-btn">
            <i data-lucide="edit-3"></i> Renommer
          </button>

          <button id="btn-duplicate" class="btn-icon modal-btn">
            <i data-lucide="copy"></i> Dupliquer
          </button>

          <button id="btn-share" class="btn-icon modal-btn primary">
            <i data-lucide="share-2"></i> Partager
          </button>

          <button id="btn-color" class="btn-icon modal-btn">
            <i data-lucide="palette"></i> Couleur
          </button>

          <button id="btn-delete" class="btn-icon modal-btn danger">
            <i data-lucide="trash-2"></i> Supprimer
          </button>

          <div id="list-actions-row" class="modal-row">
            <button id="btn-check-all" class="btn-icon modal-btn success">
              <i data-lucide="check-square"></i> Tout cocher
            </button>
            <button id="btn-uncheck-all" class="btn-icon modal-btn">
              <i data-lucide="square"></i> Tout décocher
            </button>
          </div>

          <hr class="modal-divider">

          <button id="btn-cancel" class="btn-icon modal-btn cancel">
            Annuler
          </button>
        </div>
      </div>
    </div>

    <!-- Color Picker Modal -->
    <div id="color-modal" class="hidden modal-overlay z-top">
      <div class="glass-panel modal-content compact">
        <h3 class="modal-title-small">Choisir une couleur</h3>

        <div id="color-grid" class="color-grid">
          <!-- Colors will be populated by JS -->
        </div>

        <button id="btn-color-cancel" class="btn-icon modal-btn cancel">
          Annuler
        </button>
      </div>
    </div>

    <!-- Share Management Modal -->
    <div id="share-manage-modal" class="hidden modal-overlay z-top-top">
      <div class="glass-panel modal-content medium">
        <h2 class="modal-title-large">Collaboration</h2>
        <p id="share-modal-owner" class="modal-owner-text"></p>

        <div id="add-collaborator-section" class="hidden collab-section">
          <label class="collab-label">Ajouter un collaborateur</label>
          <div class="collab-input-group">
            <input type="email" id="share-modal-input" placeholder="email@exemple.com" class="collab-input">
            <button id="btn-share-modal-add" class="btn-icon collab-add-btn">
              <i data-lucide="plus"></i>
            </button>
          </div>
        </div>

        <div id="collaborators-list" class="collab-list">
          <!-- Items injected by JS -->
        </div>

        <button id="btn-share-modal-close" class="btn-icon modal-btn secondary-alt">
          Fermer
        </button>
      </div>
    </div>

  </div>

  <!-- Add Task Input (Moved outside of #app to ensure absolute viewport fixed positioning) -->
  <div id="task-input-container" class="input-bar hidden glass-panel task-input-bar">

    <button id="toggle-header-mode" class="btn-icon header-mode-toggle">
      <i data-lucide="list"></i>
      <i data-lucide="plus" class="mini-plus"></i>
    </button>

    <input type="text" id="new-task-input" placeholder="Ajouter un élément..." class="input-field task-input">
    <button id="add-task-button" class="btn-send">
      <i data-lucide="plus"></i>
    </button>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/app.js?v=62"></script>
  <script>
    // Initialize Lucide Icons after load
    document.addEventListener("DOMContentLoaded", function () {
      lucide.createIcons();
    });
  </script>
</body>

</html>
