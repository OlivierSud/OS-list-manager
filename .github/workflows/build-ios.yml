name: 🍎 Build IPA iOS (nécessite Apple Developer)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version de l IPA (ex: 1.0.0)'
        required: false
        default: '1.0.0'

# ────────────────────────────────────────────────────────────────────────────
# ⚠️  PRÉ-REQUIS : Ce workflow nécessite un compte Apple Developer ($99/an)
#
# SECRETS GITHUB À CONFIGURER (Settings → Secrets and variables → Actions) :
#   APPLE_CERTIFICATE_BASE64     Base64 du certificat .p12 de distribution
#   APPLE_CERTIFICATE_PASSWORD   Mot de passe du certificat .p12
#   APPLE_PROVISIONING_PROFILE   Base64 du fichier .mobileprovision
#   APPLE_TEAM_ID                Votre Team ID Apple (ex: ABCD1234EF)
#   APPLE_BUNDLE_ID              Bundle ID (ex: com.oliviersud.oslistmanager)
#
# GUIDE : https://docs.github.com/en/actions/deployment/deploying-xcode-applications
# ────────────────────────────────────────────────────────────────────────────

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest  # Obligatoire — seul macOS peut compiler des apps iOS

    steps:
      # ─── 1. Récupération du code ─────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ─── 2. Configuration Node.js ────────────────────────────────────────────
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ─── 3. Installation de PWABuilder CLI ───────────────────────────────────
      - name: 📦 Install PWABuilder CLI
        run: npm install -g @pwabuilder/cli

      # ─── 4. Génération du projet Xcode via PWABuilder ────────────────────────
      - name: 🔧 Generate Xcode project from PWA
        run: |
          pwabuilder package \
            --url "https://oliviersud.github.io/OS-list-manager" \
            --platform ios \
            --output ./ios-project

      # ─── 5. Installation du certificat Apple ─────────────────────────────────
      - name: 🔑 Install Apple Certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Décoder et installer le certificat dans le keychain macOS
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S "apple-tool:,apple:" \
            -s -k "" build.keychain
          security list-keychains -s build.keychain

      # ─── 6. Installation du profil de provisioning ────────────────────────────
      - name: 📋 Install Provisioning Profile
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      # ─── 7. Build de l'archive Xcode ─────────────────────────────────────────
      - name: 🔨 Build Xcode Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
        run: |
          cd ios-project
          
          # Trouver le projet Xcode généré
          XCODEPROJ=$(find . -name "*.xcodeproj" | head -1)
          SCHEME=$(xcodebuild -list -project "$XCODEPROJ" | grep -A1 "Schemes:" | tail -1 | tr -d ' ')
          
          xcodebuild archive \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -archivePath ./build/OSListManager.xcarchive \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APPLE_BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            -allowProvisioningUpdates

      # ─── 8. Export de l'IPA ───────────────────────────────────────────────────
      - name: 📦 Export IPA
        run: |
          cd ios-project
          
          # Créer le fichier d'options d'export
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath ./build/OSListManager.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath ./build/ipa/

      # ─── 9. Renommer l'IPA ────────────────────────────────────────────────────
      - name: 📋 Rename IPA
        run: |
          VERSION="${{ github.event.inputs.version || '1.0.0' }}"
          find ios-project/build/ipa -name "*.ipa" -exec \
            cp {} "OS-List-Manager-v${VERSION}.ipa" \;
          ls -lh *.ipa

      # ─── 10. Upload de l'IPA comme artifact ──────────────────────────────────
      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OS-List-Manager-IPA-v${{ github.event.inputs.version || '1.0.0' }}
          path: "*.ipa"
          retention-days: 30

      # ─── 11. Résumé ──────────────────────────────────────────────────────────
      - name: 📊 Build Summary
        run: |
          echo "## 🍎 IPA iOS généré !" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Paramètre | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ github.event.inputs.version || '1.0.0' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bundle ID** | ${{ secrets.APPLE_BUNDLE_ID }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL cible** | https://oliviersud.github.io/OS-list-manager |" >> $GITHUB_STEP_SUMMARY
          echo "| **Méthode** | PWABuilder → Xcode |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⬇️ **IPA disponible dans Artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation via AltStore ou TestFlight" >> $GITHUB_STEP_SUMMARY
