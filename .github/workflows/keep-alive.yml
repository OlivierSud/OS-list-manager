name: Keep Supabase Alive

on:
  schedule:
    # Runs every 5 days at 12:00 UTC
    - cron: '0 12 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://jxpntkdfcaoljywnjdzq.supabase.co/rest/v1/" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4cG50a2RmY2FvbGp5d25qZHpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMDU1MjIsImV4cCI6MjA4ODU4MTUyMn0.7sXhkRes625ECOeZvHpmlJZfncb4NGnYqlPWvLL6SvA")
          echo "Ping Supabase → HTTP $STATUS at $(date -u)"

      - name: Update README uptime badge
        run: |
          START_DATE="2026-02-11"
          TODAY=$(date -u +%Y-%m-%d)
          DAYS=$(( ($(date -d "$TODAY" +%s) - $(date -d "$START_DATE" +%s)) / 86400 ))

          NEW_LINE="🟢 **Système actif depuis : ${DAYS} jours** *(dernière vérification : ${TODAY})*"

          sed -i "s|🟢 .*|${NEW_LINE}|" README.md

          echo "Uptime : $DAYS jours"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: mise à jour uptime $(date -u +%Y-%m-%d)"
          git push
