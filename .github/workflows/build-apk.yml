name: 📱 Build APK Android (TWA)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version de l APK (ex: 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build-apk:
    name: Build TWA APK
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Récupération du code ──────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ─── 2. Java JDK 17 ──────────────────────────────────────────────────────
      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ─── 3. Node.js ──────────────────────────────────────────────────────────
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ─── 4. Android SDK (Command Line Tools seulement) ───────────────────────
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Android Build Tools & Platform
        run: |
          sdkmanager --install \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "platform-tools" \
            --sdk_root=$ANDROID_HOME

      # ─── 5. Bubblewrap CLI ───────────────────────────────────────────────────
      - name: 🫧 Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      # ─── 6. Créer twa-manifest.json directement (sans bubblewrap init) ───────
      #
      # On évite 'bubblewrap init' car il pose des questions interactives
      # en mode terminal. On crée le fichier de config manuellement,
      # puis 'bubblewrap build' s'en occupe directement.
      #
      - name: ⚙️ Créer twa-manifest.json
        working-directory: APK-android
        run: |
          VERSION="${{ github.event.inputs.version || '1.0.0' }}"
          node -e "
          const manifest = {
            packageId: 'com.oliviersud.oslistmanager',
            host: 'oliviersud.github.io',
            name: 'OS List Manager',
            launcherName: 'Mes Listes',
            display: 'standalone',
            themeColor: '#3b82f6',
            navigationColor: '#0f172a',
            navigationColorDark: '#0f172a',
            navigationDividerColor: '#0f172a',
            navigationDividerColorDark: '#0f172a',
            backgroundColor: '#0f172a',
            enableNotifications: false,
            startUrl: '/OS-list-manager/',
            iconUrl: 'https://img.icons8.com/color/512/checklist--v1.png',
            maskableIconUrl: 'https://img.icons8.com/color/512/checklist--v1.png',
            monochromeIconUrl: 'https://img.icons8.com/color/512/checklist--v1.png',
            splashScreenFadeOutDuration: 300,
            signingKey: {
              path: './keystore/os-list-manager.keystore',
              alias: 'oslistmanager'
            },
            appVersionCode: 1,
            appVersionName: process.env.VERSION || '1.0.0',
            queries: [],
            shortcuts: [],
            generatorApp: 'bubblewrap-cli',
            webManifestUrl: 'https://oliviersud.github.io/OS-list-manager/manifest.json',
            fallbackType: 'customtabs',
            features: {},
            alphaDependencies: { enabled: false },
            enableSiteSettingsShortcut: true,
            isChromeOSOnly: false,
            isMetaQuest: false,
            orientation: 'default',
            fingerprints: []
          };
          require('fs').writeFileSync('twa-manifest.json', JSON.stringify(manifest, null, 2));
          console.log('✅ twa-manifest.json créé');
          console.log(JSON.stringify(manifest, null, 2));
          "
        env:
          VERSION: ${{ github.event.inputs.version || '1.0.0' }}

      # ─── 7. Générer le keystore de signature (sans prompt) ───────────────────
      - name: 🔑 Générer le keystore de signature
        working-directory: APK-android
        run: |
          mkdir -p keystore
          keytool -genkeypair \
            -keystore keystore/os-list-manager.keystore \
            -alias oslistmanager \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "OsListBuild2024!" \
            -keypass "OsListBuild2024!" \
            -dname "CN=OS List Manager, OU=Personal, O=OlivierSud, L=France, ST=France, C=FR" \
            -noprompt
          echo "✅ Keystore généré"
          keytool -list -keystore keystore/os-list-manager.keystore \
            -storepass "OsListBuild2024!" \
            -alias oslistmanager

      # ─── 8. Build de l'APK (lit twa-manifest.json, pas de prompt) ────────────
      - name: 🔨 Build APK
        working-directory: APK-android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: "OsListBuild2024!"
          BUBBLEWRAP_KEY_PASSWORD: "OsListBuild2024!"
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          echo "🔧 Java version :"
          java -version
          echo ""
          echo "🤖 Android SDK : $ANDROID_HOME"
          echo ""
          echo "🔨 Lancement du build..."
          bubblewrap build --skipPwaValidation

      # ─── 9. Localiser et renommer l'APK généré ───────────────────────────────
      - name: 📋 Localiser et renommer l'APK
        working-directory: APK-android
        run: |
          VERSION="${{ github.event.inputs.version || '1.0.0' }}"
          mkdir -p output

          echo "🔍 Recherche des fichiers APK générés :"
          find . -name "*.apk" -not -path "./output/*" 2>/dev/null || echo "Aucun APK trouvé"

          APK_FILE=$(find . -name "*.apk" -not -path "./output/*" | head -1)

          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "output/OS-List-Manager-v${VERSION}.apk"
            echo ""
            echo "✅ APK copié : output/OS-List-Manager-v${VERSION}.apk"
            ls -lh "output/"
          else
            echo "❌ Aucun APK trouvé. Contenu du dossier build :"
            find . -name "*.apk" -o -name "*.aab" 2>/dev/null
            exit 1
          fi

      # ─── 10. Upload de l'APK comme artifact téléchargeable ───────────────────
      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OS-List-Manager-APK-v${{ github.event.inputs.version || '1.0.0' }}
          path: APK-android/output/*.apk
          retention-days: 30

      # ─── 11. Résumé ──────────────────────────────────────────────────────────
      - name: 📊 Résumé du build
        run: |
          echo "## 📱 APK Android généré avec succès !" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Paramètre | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ github.event.inputs.version || '1.0.0' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package** | com.oliviersud.oslistmanager |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL cible** | https://oliviersud.github.io/OS-list-manager |" >> $GITHUB_STEP_SUMMARY
          echo "| **Méthode** | TWA (Trusted Web Activity) — Bubblewrap |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⬇️ **Téléchargez l'APK dans l'onglet Artifacts ci-dessous**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📲 Installation sur Android" >> $GITHUB_STEP_SUMMARY
          echo "1. Téléchargez le ZIP de l'artifact et extrayez l'APK" >> $GITHUB_STEP_SUMMARY
          echo "2. Copiez l'APK sur votre téléphone" >> $GITHUB_STEP_SUMMARY
          echo "3. Activez **Sources inconnues** dans les paramètres Android" >> $GITHUB_STEP_SUMMARY
          echo "4. Ouvrez le fichier APK pour installer" >> $GITHUB_STEP_SUMMARY
